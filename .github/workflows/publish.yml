name: publish
on:
  workflow_dispatch:
    inputs:
      digests:
        description: digests (pacote de origem imagens-docker)
        required: true
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Copy digests (identidade do workflow no destino)
        env:
          SRC_PAT: "${{ secrets.GHCR_SRC_PAT }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          for d in ${{ inputs.digests }}; do
            skopeo copy --src-creds "LeonardoDiasRR:$SRC_PAT" --dest-creds "${{ github.actor }}:$GITHUB_TOKEN" \
              "docker://ghcr.io/leonardodiasrr/imagens-docker@$d" \
              "docker://ghcr.io/leonardodiasrr/detectorr-img@$d"
            echo "copied $d"
          done
